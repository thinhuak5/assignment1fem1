<mat-card class="p-4">
  <h2 class="mb-4">Sửa sản phẩm</h2>

  <div style="display: flex; gap: 24px; flex-wrap: wrap">
    <!-- Cột trái: Form -->
    <form style="flex: 2; min-width: 280px; display: flex; flex-direction: column; gap: 16px">
      <mat-form-field appearance="outline">
        <mat-label>Tên sản phẩm</mat-label>
        <input matInput placeholder="Nhập tên sản phẩm" name="name"/>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Giá</mat-label>
        <input matInput type="number" placeholder="Nhập giá" name="price"/>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Ảnh sản phẩm</mat-label>
        <input matInput placeholder="URL ảnh hoặc chọn file" name="image"/>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Trạng thái thanh toán</mat-label>
        <mat-select name="paymentStatus">
          <mat-option value="cancelled">Đã hủy</mat-option>
          <mat-option value="partial">Trả một phần</mat-option>
          <mat-option value="paid">Thanh toán đầy đủ</mat-option>
        </mat-select>
      </mat-form-field>

      <div style="display: flex; gap: 12px">
        <button mat-raised-button color="accent" type="button">Cập nhật sản phẩm</button>
        <button mat-stroked-button color="primary" type="button" [routerLink]="['/ui-components/tables']">
          Quay lại
        </button>
      </div>
    </form>

    <!-- Cột phải: Hình ảnh -->
    <div style="flex: 1; min-width: 250px; max-width: 300px">
      <img
        src="https://lh7-rt.googleusercontent.com/docsz/AD_4nXcxb5IpP5sQKwBGVY3RynVDCn7xACt6gf3vs6MLtiqz0BlsyolDBDOp9KMVNFWbmvS-5Odc_5feqK5IK0NdtwCKPf2yozIOsluZI_URKUoJFV5iMRlgMkJNIccE9LWFjFfeUZZSkuCSrsltxak4FqEQdZQS?key=D7iSQBJlXYdsdlaEymwxNA"
        alt="Ảnh sản phẩm"
        style="width: 100%; border-radius: 8px; object-fit: cover; border: 1px solid #ccc"
      />
    </div>
  </div>
</mat-card>
