<mat-card class="cardWithShadow">
    <mat-card-content>
      <div class="d-flex justify-content-between align-items-center">
        <mat-card-title>Danh Mục</mat-card-title>
        <button mat-raised-button color="primary" [routerLink]="['/ui-components/add-category']">
          <mat-icon>add</mat-icon>
          Thêm Danh Mục
        </button>
      </div>

      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

          <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef> No. </th>
            <td mat-cell *matCellDef="let element"> {{ element.id }}</td>
            </ng-container>

          <ng-container matColumnDef="images">
            <th mat-header-cell *matHeaderCellDef> Image</th>
            <td mat-cell *matCellDef="let element">
              <img [src]="element.images" alt="images" width="60" class="rounded"/>
            </td>
          </ng-container>

          <!-- Name Column -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef> Tên</th>
              <td mat-cell *matCellDef="let element"> {{element.name}} </td>
            </ng-container>


          <!-- Weight Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef> Mô tả</th>
            <td mat-cell *matCellDef="let element"> {{ element.description }}</td>
            </ng-container>

            <!-- Symbol Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Trạng Thái</th>
            <td mat-cell *matCellDef="let element" [ngStyle]="{'color': element.status === 1 ? 'green' : 'red'}">
              {{ element.status === 1 ? 'Hiển thị' : 'Ẩn' }}
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Hành Động</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button color="warn">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
      </div>
    </mat-card-content>
  </mat-card>
