<mat-card class="cardWithShadow">
  <mat-card-content>
    <mat-card-title>Table</mat-card-title>

    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <!-- Position Column -->
        <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef> No. </th>
          <td mat-cell *matCellDef="let element"> {{element.position}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let element">
            <input *ngIf="element.isEditing" [(ngModel)]="element.name" class="edit-input" />
            <span *ngIf="!element.isEditing">{{ element.name }}</span>
          </td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="weight">
          <th mat-header-cell *matHeaderCellDef> Weight </th>
          <td mat-cell *matCellDef="let element">
            <input *ngIf="element.isEditing" [(ngModel)]="element.weight" type="number" class="edit-input" />
            <span *ngIf="!element.isEditing">{{ element.weight }}</span>
          </td>
        </ng-container>

        <!-- Symbol Column -->
        <ng-container matColumnDef="symbol">
          <th mat-header-cell *matHeaderCellDef> Symbol </th>
          <td mat-cell *matCellDef="let element">
            <input *ngIf="element.isEditing" [(ngModel)]="element.symbol" class="edit-input" />
            <span *ngIf="!element.isEditing">{{ element.symbol }}</span>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button (click)="toggleEdit(element)">
              <mat-icon>{{ element.isEditing ? 'save' : 'edit' }}</mat-icon>
            </button>
            <button mat-icon-button (click)="deleteElement(element)">
              <mat-icon>delete</mat-icon>
            </button>
            <button mat-icon-button>
              <mat-icon>comment</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
