<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="d-flex justify-content-between align-items-center">
      <mat-card-title>Danh Mục</mat-card-title>
      <button mat-raised-button color="primary" [routerLink]="['/ui-components/category/create']">
        <mat-icon>add</mat-icon>
        Thêm Danh Mục
      </button>
    </div>

    <div class="table-responsive">
      <table mat-table [dataSource]="list" class="mat-elevation-z8">

        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID</th>
          <td mat-cell *matCellDef="let item"> {{ item.id }}</td>
        </ng-container>

        <!-- Image Column -->
        <ng-container matColumnDef="images">
          <th mat-header-cell *matHeaderCellDef> Hình Ảnh</th>
          <td mat-cell *matCellDef="let item">
            <img [src]="item.images || 'assets/images/default.jpg'" alt="image" width="150" height="100"
                 class="rounded"/>
          </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Tên</th>
          <td mat-cell *matCellDef="let item"> {{ item.name }}</td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Trạng Thái</th>
          <td mat-cell *matCellDef="let item" [ngStyle]="{'color': item.status === 1 ? 'green' : 'red'}">
            {{ item.status === 1 ? 'Hiển thị' : 'Ẩn' }}
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Hành Động</th>
          <td mat-cell *matCellDef="let item">
            <a mat-icon-button color="primary" [routerLink]="['/ui-components/category/edit', item.id]">
              <mat-icon>edit</mat-icon>
            </a>
            <button (click)="openDialog(item.id, item.name)" mat-icon-button color="warn">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Table Rows -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
