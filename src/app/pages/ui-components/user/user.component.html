<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="d-flex justify-content-between align-items-center">
      <mat-card-title>Thông Tin Tài Khoản</mat-card-title>
      <button mat-raised-button color="primary" [routerLink]="['/ui-components/add-user']">
        <mat-icon>add</mat-icon>
        Thêm tài khoản
      </button>


    </div>

    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource1" class="w-100">

        <!-- Hình ảnh -->
        <ng-container matColumnDef="image">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Hình ảnh</th>
          <td mat-cell *matCellDef="let element">
            <img [src]="element.imagePath" alt="avatar" width="60" class="rounded"/>
          </td>
        </ng-container>

        <!-- Tên -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Tên</th>
          <td mat-cell *matCellDef="let element">
            {{ element.name }}
          </td>
        </ng-container>

        <!-- Email -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Email</th>
          <td mat-cell *matCellDef="let element">
            {{ element.email }}
          </td>
        </ng-container>

        <!-- Số điện thoại -->
        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Số điện thoại</th>
          <td mat-cell *matCellDef="let element">
            {{ element.phone }}
          </td>
        </ng-container>

        <!-- Địa chỉ -->
        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Địa chỉ</th>
          <td mat-cell *matCellDef="let element">
            {{ element.address }}
          </td>
        </ng-container>

        <!-- Mật khẩu -->
        <ng-container matColumnDef="password">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Mật khẩu</th>
          <td mat-cell *matCellDef="let element">
            {{ element.password }}
          </td>
        </ng-container>

        <!-- Hành động -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Hành động</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="accent" [routerLink]="['/ui-components/edit-user']">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns1"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns1"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
