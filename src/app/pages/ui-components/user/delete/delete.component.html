<h2 mat-dialog-title>Hi {{ data.name }}</h2>
<mat-dialog-content>
  <p>Bạn có chắc muốn xóa người dùng này?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Không</button>
  <button mat-button color="warn" (click)="deleted()">Xóa</button>
</mat-dialog-actions>
