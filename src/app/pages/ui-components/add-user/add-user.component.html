<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">Thêm Người Dùng</mat-card-title>
  </mat-card-header>
  <mat-card-content class="b-t-1">
    <form>
      <div class="row">
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Tên của bạn</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput placeholder="Tên của bạn"/>
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Số điện thoại</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput type="tel" placeholder="Số điện thoại"/>
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Email</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput type="email" placeholder="Email của bạn"/>
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Trạng thái</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <mat-select>
              <mat-option value="active">Hoạt động</mat-option>
              <mat-option value="inactive">Không hoạt động</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Mật khẩu</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input matInput type="password" placeholder="Mật khẩu"/>
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Thành phố</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <mat-select>
              <mat-option value="hanoi">Hà Nội</mat-option>
              <mat-option value="hochiminh">TP. Hồ Chí Minh</mat-option>
              <mat-option value="danang">Đà Nẵng</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div class="m-t-12">
        <button mat-flat-button color="primary" class="m-r-8">Gửi</button>
        <button mat-stroked-button color="warn" [routerLink]="['/ui-components/user']">Hủy</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
