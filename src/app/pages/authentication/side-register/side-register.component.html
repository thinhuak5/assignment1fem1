<div class="blank-layout-container justify-content-center align-items-center bg-light">
  <div class="position-relative row w-100 h-100 bg-gradient justify-content-center">
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-4">
          <div class="text-center">
            <a [routerLink]="['/']">
              <img src="./assets/images/logos/dark-logo.svg" class="align-middle m-2" alt="logo" />
            </a>
          </div>

          <div class="row mt-4">
            <!-- Các nút Google và Facebook -->
            <div class="col-12 col-sm-6">
              <button mat-stroked-button class="w-100">
                <div class="d-flex align-items-center justify-content-center">
                  <img src="/assets/images/svgs/google-icon.svg" alt="google" width="16" class="me-2"/>
                  Google
                </div>
              </button>
            </div>
            <div class="col-12 col-sm-6 mt-2 mt-sm-0">
              <button mat-stroked-button class="w-100">
                <div class="d-flex align-items-center justify-content-center">
                  <img src="/assets/images/svgs/facebook-icon.svg" alt="facebook" width="20" class="me-2"/>
                  Facebook
                </div>
              </button>
            </div>
          </div>

          <div class="or-border my-4 text-center">Hoặc đăng ký bằng Email</div>

          <form [formGroup]="form" (ngSubmit)="submit()">

            <mat-label class="form-label">Tên đăng nhập</mat-label>
            <mat-form-field appearance="outline" class="w-100 mb-3" color="primary">
              <input matInput formControlName="username" placeholder="Tên đăng nhập"/>
            </mat-form-field>
            <div *ngIf="f['username'].touched && f['username'].invalid" class="text-danger small mb-3">
              Tên đăng nhập ít nhất 6 ký tự
            </div>

            <mat-label class="form-label">Email</mat-label>
            <mat-form-field appearance="outline" class="w-100 mb-3" color="primary">
              <input matInput type="email" formControlName="email" placeholder="Email"/>
            </mat-form-field>
            <div *ngIf="f['email'].touched && f['email'].invalid" class="text-danger small mb-3">
              Vui lòng nhập email hợp lệ
            </div>

            <mat-label class="form-label">Mật khẩu</mat-label>
            <mat-form-field appearance="outline" class="w-100 mb-3" color="primary">
              <input matInput type="password" formControlName="password" placeholder="Mật khẩu"/>
            </mat-form-field>
            <div *ngIf="f['password'].touched && f['password'].invalid" class="text-danger small mb-3">
              Mật khẩu ít nhất 6 ký tự
            </div>

            <!-- Thêm trường "Tên" -->
            <mat-label class="form-label">Tên đầy đủ</mat-label>
            <mat-form-field appearance="outline" class="w-100 mb-3" color="primary">
              <input matInput formControlName="name" placeholder="Tên đầy đủ"/>
            </mat-form-field>
            <div *ngIf="f['name'].touched && f['name'].invalid" class="text-danger small mb-3">
              Tên không được để trống
            </div>

            <!-- Thêm trường "Số điện thoại" -->
            <mat-label class="form-label">Số điện thoại</mat-label>
            <mat-form-field appearance="outline" class="w-100 mb-3" color="primary">
              <input matInput type="text" formControlName="phone" placeholder="Số điện thoại"/>
            </mat-form-field>
            <div *ngIf="f['phone'].touched && f['phone'].invalid" class="text-danger small mb-3">
              Số điện thoại là bắt buộc
            </div>

            <!-- Upload ảnh -->
            <div class="mb-3">
              <label for="file">Chọn ảnh người dùng:</label>
              <input type="file" id="file" (change)="onFileSelected($event)"/>
            </div>

            <!-- Xem trước ảnh -->
            <div *ngIf="form.get('avatar')?.value" class="mb-3">
              <p>Ảnh xem trước:</p>
              <img [src]="form.get('avatar')?.value" alt="Preview" width="200" class="rounded"/>
            </div>

            <!-- URL ảnh -->
            <mat-form-field appearance="outline" class="w-100 mb-4">
              <mat-label>URL ảnh người dùng</mat-label>
              <input matInput formControlName="avatar" placeholder="Nhập URL ảnh"/>
            </mat-form-field>


            <button mat-flat-button color="primary" class="w-100 mt-2" type="submit">
              Đăng ký
            </button>
          </form>

          <div class="text-center mt-4">
            <span class="text-muted">Đã có tài khoản? </span>
            <a [routerLink]="['/authentication/login']" class="text-primary text-decoration-none">
              Đăng nhập
            </a>
          </div>

        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
