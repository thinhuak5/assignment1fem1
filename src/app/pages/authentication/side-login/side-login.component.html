<div class="blank-layout-container justify-content-center align-items-center bg-light">
  <div class="position-relative row w-100 h-100 bg-gradient justify-content-center">
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32">
          <!-- Logo -->
          <div class="text-center">
            <a [routerLink]="['/dashboard']">
              <img src="./assets/images/logos/dark-logo.svg" alt="logo" class="align-middle m-2"/>
            </a>
          </div>

          <!-- Social Login -->
          <div class="row mt-3">
            <div class="col-12 col-sm-6 mb-2 mb-sm-0">
              <button mat-stroked-button class="w-100">
                <img src="/assets/images/svgs/google-icon.svg" alt="Google" width="16" class="me-2"/>
                Đăng nhập Google
              </button>
            </div>
            <div class="col-12 col-sm-6">
              <button mat-stroked-button class="w-100">
                <img src="/assets/images/svgs/facebook-icon.svg" alt="Facebook" width="20" class="me-2"/>
                Đăng nhập Facebook
              </button>
            </div>
          </div>

          <!-- Divider -->
          <div class="or-border mt-4 mb-3 text-center">hoặc đăng nhập bằng</div>

          <!-- Alert Messages -->
          <ng-alerts [messages]="alertMessages"></ng-alerts>

          <!-- Login Form -->
          <form [formGroup]="formData" (ngSubmit)="handleLogin()">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" formControlName="email"
                     placeholder="Nhập email của bạn">
              <span class="text-danger" *ngIf="email?.invalid && (email?.dirty || email?.touched)">
                Email là bắt buộc
              </span>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Mật khẩu</label>
              <input type="password" class="form-control" id="password" formControlName="password"
                     placeholder="Nhập mật khẩu">
              <span class="text-danger" *ngIf="password?.invalid && (password?.dirty || password?.touched)">
                Mật khẩu là bắt buộc
              </span>
            </div>

            <div class="d-flex align-items-center mb-3">
              <mat-checkbox color="primary" formControlName="rememberMe">Hãy nhớ thiết bị này</mat-checkbox>
              <a [routerLink]="['/forgot-password']" class="ms-auto text-primary text-decoration-none">Lấy lại mật
                khẩu?</a>
            </div>

            <button class="btn btn-primary w-100" [disabled]="!formData.valid">Đăng nhập</button>
          </form>

          <!-- Register link -->
          <div class="text-center mt-4">
            <span>Bạn chưa có tài khoản? </span>
            <a [routerLink]="['/authentication/register']" class="text-primary text-decoration-none">Tạo tài khoản</a>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
