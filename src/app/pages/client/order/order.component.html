<!-- Import Header -->
<app-header></app-header>

<div class="container my-5">
  <h2 class="mb-4">Thanh toán</h2>
  <div class="row">
    <!-- Bảng sản phẩm (bên trái) -->
    <div class="col-md-7 mb-4">
      <div class="table-responsive">
        <table class="table table-bordered align-middle text-center">
          <thead class="table-light">
          <tr>
            <th>Hình ảnh</th>
            <th>Tên sản phẩm</th>
            <th>Số lượng</th>
            <th>Đơn giá</th>
            <th>Thành tiền</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let item of cartItems">
            <td><img [src]="item.image" [alt]="item.name" width="70"></td>
            <td>{{ item.name }}</td>
            <td>{{ item.quantity }}</td>
            <td>{{ item.price | number: '1.0-0' }} VNĐ</td>
            <td>{{ item.total | number: '1.0-0' }} VNĐ</td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="text-end">
        <h5 class="mt-3">Tổng cộng: <span class="text-danger">{{ getTotal() | number: '1.0-0' }} VNĐ</span></h5>
      </div>
    </div>

    <!-- Form khách hàng (bên phải) -->
    <div class="col-md-5">
      <h4 class="mb-3">Thông tin giao hàng</h4>
      <form>
        <div class="mb-3">
          <label for="fullname" class="form-label">Họ và tên</label>
          <input type="text" class="form-control" id="fullname" placeholder="Nguyễn Văn A" required>
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">Số điện thoại</label>
          <input type="tel" class="form-control" id="phone" placeholder="0901234567" required>
        </div>
        <div class="mb-3">
          <label for="address" class="form-label">Địa chỉ giao hàng</label>
          <textarea class="form-control" id="address" rows="3"
                    placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành phố" required></textarea>
        </div>
        <div class="mb-3">
          <label for="note" class="form-label">Ghi chú (tuỳ chọn)</label>
          <textarea class="form-control" id="note" rows="2"
                    placeholder="Ví dụ: Giao giờ hành chính, gọi trước khi đến..."></textarea>
        </div>
        <div class="text-end">
          <button type="submit" class="btn btn-success btn-lg w-100">Xác nhận đặt hàng</button>
        </div>
      </form>
    </div>
  </div>
</div>
<!-- Import Footer -->
<app-footer></app-footer>
