<!-- Import Header -->
<app-header></app-header>

<!-- Banner -->
<!-- Product List -->
<div class="container my-4">
  <div class="row row-cols-1 row-cols-md-4 g-4">
    <!-- Hiển thị sản phẩm -->
    <div class="col" *ngFor="let product of products">
      <div class="card">
        <!-- Sửa kích thước ảnh -->
        <img [src]="product.images" class="card-img-top" alt="{{ product.name }}" style="height: 150px; width: 100%; object-fit: cover;">
        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text">{{ product.description }}</p>
          <p class="card-text"><strong>Giá: </strong>{{ product.price | currency }}</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Import Footer -->
<app-footer></app-footer>
