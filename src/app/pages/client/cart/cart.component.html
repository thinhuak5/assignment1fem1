<!-- Import Header -->
<app-header></app-header>

<div class="container my-4">
  <h2>Giỏ hàng của bạn</h2>

  <div class="table-responsive">
    <table class="table table-bordered align-middle text-center">
      <thead class="table-light">
      <tr>
        <th>Hình ảnh</th>
        <th>Tên sản phẩm</th>
        <th>Mô tả</th>
        <th>Giá</th>
        <th>Số lượng</th>
        <th>Thành tiền</th>
        <th>Xóa</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let item of cartItems">
        <td>
          <img [src]="item.product.images" alt="{{ item.product.name }}" width="80">
        </td>
        <td>{{ item.product.name }}</td>
        <td>{{ item.product.short_description }}</td>
        <td>{{ item.price | number: '1.0-0' }} VNĐ</td>
        <td>
          <div class="d-flex justify-content-center align-items-center">
            <button class="btn btn-sm btn-secondary me-2" (click)="updateQuantity(item.product_id, item.quantity - 1)">
              -
            </button>
            <span>{{ item.quantity }}</span>
            <button class="btn btn-sm btn-secondary ms-2" (click)="updateQuantity(item.product_id, item.quantity + 1)">
              +
            </button>
          </div>
        </td>
        <td>{{ item.price * item.quantity | number: '1.0-0' }} VNĐ</td>
        <td>
          <button class="btn btn-sm btn-danger" (click)="removeFromCart(item.product_id)">Xóa</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Tổng tiền + Thanh toán -->
  <div class="row pt-3 mt-4 border-top">
    <div class="col-md-8">
      <h4>Tổng cộng: <span class="text-danger">{{ totalPrice | number: '1.0-0' }} VNĐ</span></h4>
    </div>
    <div class="col-md-4 text-end">
      <button class="btn btn-success btn-lg" [routerLink]="'/order'">Thanh toán</button>
    </div>
  </div>
</div>

<!-- Import Footer -->
<app-footer></app-footer>
